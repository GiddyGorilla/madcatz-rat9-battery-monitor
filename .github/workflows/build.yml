name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build application
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { '1.0.0' }
          ./build.ps1 -Version $version

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MadCatz-RAT9-Battery-Monitor
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/RELEASE_NOTES_${{ github.ref_name }}.md
          files: |
            dist/RAT9BatteryTray.exe
            dist/RAT9BatteryProbe.exe
            dist/V102BatteryProbe.exe
            dist/RAT9RecoveryTool.exe
            dist/MadCatz-RAT9-Battery-Monitor-v*-win.zip
            dist/SHA256SUMS.txt
